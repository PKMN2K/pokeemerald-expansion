name: Port Worpbane Summary UI

on:
  push:
    branches:
      - worpbane-ui-no-battle-hud
    paths:
      - .github/workflows/port-worpbane-summary.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worpbane-ui-no-battle-hud
          fetch-depth: 0
      - name: Apply summary UI commits
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add worpbane https://github.com/worpbane/pokeemerald-worped-ex.git
          git fetch worpbane ui/swshsummer
          git cherry-pick -m 1 6537ac799d
          git cherry-pick 564fa8d4e4
          git cherry-pick 0f17a44bbc
          git rm .github/workflows/port-worpbane-summary.yml
          git commit -m "Remove temporary Summary UI port workflow"
          git push origin HEAD:worpbane-ui-no-battle-hud
