name: HGSS ribbon live PokéNav screenshots

on:
  push:
    branches: [feature/gen4-ui-renderer]
    paths:
      - .github/workflows/hgss-ribbon-live-pokenav.yml
      - tools/gen4_ui/prepare_hgss_ribbon_live_capture.py
      - tools/gen4_ui/verify_hgss_ribbon_live_screens.py
      - src/pokenav.c
      - src/pokenav_ribbons_summary.c
      - graphics/gen4_ui/hgss_ribbons/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pokenav-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      COMPARE: 0
      UNUSED_ERROR: 1
      DEPRECATED_ERROR: 1
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install GBA compiler and screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev libmgba-dev python3 python3-pil git

      - name: Build isolated live PokéNav screenshot fixture
        run: |
          python3 tools/gen4_ui/prepare_hgss_ribbon_live_capture.py
          make -j$(nproc) -O all
          test -s pokeemerald.gba

      - name: Build pinned mGBA headless screenshot utility
        run: |
          git clone https://github.com/JohnnySun/gba-rom-debugger.git /tmp/gba-rom-debugger
          git -C /tmp/gba-rom-debugger checkout --detach 1ab7c814f9e062790567c58c8c0c2b74ad62e1ae
          # The upstream screenshot utility deliberately suppresses every
          # mGBA diagnostic. Restore stderr output in this disposable CI
          # checkout to diagnose black-screen crashes during menu transition.
          python3 - <<'PY'
          from pathlib import Path
          source = Path("/tmp/gba-rom-debugger/src/gba-walk.c")
          content = source.read_text()
          old = "(void) logger; (void) category; (void) level; (void) format; (void) args;"
          new = "(void) logger; (void) category; (void) level; { char msg[512]; static unsigned int nonstage_lines = 0; vsnprintf(msg, sizeof(msg), format, args); if (strstr(msg, \"RIBBON_STAGE\") || nonstage_lines++ < 200) fprintf(stderr, \"%s\\\\n\", msg); }"
          assert content.count(old) == 1
          source.write_text(content.replace(old, new))
          PY
          cc -std=gnu11 -O2 -DUSE_PNG -o /tmp/gba-walk \
            /tmp/gba-rom-debugger/src/gba-walk.c -lmgba -lpng

      - name: Capture actual ribbon list, five-page navigation and zoom
        run: |
          mkdir -p build/hgss-ribbon-live
          # Detect the known blackout promptly before performing the longer
          # navigation sequence. Keep these early frames as failure artifacts.
          /tmp/gba-walk pokeemerald.gba build/hgss-ribbon-live \
            run:700 snap:main_menu \
            press:A:1 snap:after_select_01 \
            run:25 snap:after_select_25 \
            run:100 snap:after_select_125
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ("main_menu", "after_select_01", "after_select_25", "after_select_125"):
              im = Image.open(Path("build/hgss-ribbon-live") / f"{name}.png").convert("RGB")
              colors = len(im.getcolors(im.width * im.height) or [])
              print(f"{name}: {colors} colors", flush=True)
          im = Image.open("build/hgss-ribbon-live/after_select_125.png").convert("RGB")
          if len(im.getcolors(im.width * im.height) or []) < 16:
              raise SystemExit("PokéNav remains black after 125 frames; inspect early screenshots")
          PY
          /tmp/gba-walk pokeemerald.gba build/hgss-ribbon-live \
            run:700 snap:main_menu \
            press:A:1 snap:after_select_01 \
            run:25 snap:after_select_25 \
            run:100 snap:after_select_125 \
            run:275 snap:owner_list \
            press:A:1 run:220 snap:summary_page_01 \
            press:A:1 run:100 snap:zoom_page_01 \
            press:DOWN:1 run:110 press:DOWN:1 run:110 \
            press:DOWN:1 run:110 press:DOWN:1 run:110 \
            press:DOWN:1 run:110 press:DOWN:1 run:110 \
            snap:zoom_normal_page_04 \
            press:DOWN:1 run:110 snap:zoom_gift_page_04 \
            press:DOWN:1 run:110 snap:zoom_gift_page_05 \
            press:B:1 run:110 snap:summary_page_05
          python3 tools/gen4_ui/check_hgss_ribbon_grid.py --preview-dir build/hgss-ribbon-offline
          python3 tools/gen4_ui/verify_hgss_ribbon_live_screens.py \
            build/hgss-ribbon-live build/hgss-ribbon-offline
          printf '%s\n' \
            'These are real mGBA framebuffer screenshots of the LIVE PokéNav ribbon list and summary.' \
            'A disposable CI checkout patches only its initial callback, ribbon test data and initial menu cursor.' \
            'The REAL PokéNav initial graphics path, ribbon list and ribbon summary remain intact.' \
            'No ROM, save, game code patch or original HGSS art is uploaded.' \
            'Inspection of full-screen panel layout, cursor, descriptions and palette remains required.' \
            > build/hgss-ribbon-live/README.txt

      - name: Upload actual PokéNav screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hgss-ribbon-live-pokenav-screenshots
          path: build/hgss-ribbon-live/
          if-no-files-found: warn
