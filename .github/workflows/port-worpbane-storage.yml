name: Port Worpbane Storage UI

on:
  push:
    branches:
      - worpbane-ui-no-battle-hud
    paths:
      - .github/workflows/port-worpbane-storage.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worpbane-ui-no-battle-hud
          fetch-depth: 0
      - name: Apply storage UI commits
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add worpbane https://github.com/worpbane/pokeemerald-worped-ex.git
          git fetch worpbane ui/swshbox
          git cherry-pick -m 1 a76fd48bd5
          git cherry-pick 98a15fc083
          git cherry-pick a56f429412
          git cherry-pick 2b855bff1a
          git cherry-pick e18ba78af1
          git cherry-pick 9445ef3621
          git rm .github/workflows/port-worpbane-storage.yml
          git commit -m "Remove temporary Storage UI port workflow"
          git push origin HEAD:worpbane-ui-no-battle-hud
