name: Port Worpbane Party UI

on:
  push:
    branches:
      - worpbane-ui-no-battle-hud
    paths:
      - .github/workflows/port-worpbane-party.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worpbane-ui-no-battle-hud
          fetch-depth: 0
      - name: Apply party UI commits
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add worpbane https://github.com/worpbane/pokeemerald-worped-ex.git
          git fetch worpbane ui/swshparty

          if ! git cherry-pick -m 1 14b0a7eef5; then
            git checkout --ours include/pokemon.h include/pokemon_summary_screen.h
            python3 - <<'PY'
          from pathlib import Path
          p=Path("include/pokemon.h"); s=p.read_text()
          s=s.replace("bool8 PokemonUseItemEffects(struct Pokemon *mon, enum Item item, u8 partyIndex, u8 moveIndex, u8 usedByAI);","bool8 PokemonUseItemEffects(struct Pokemon *mon, enum Item item, u8 partyIndex, u8 moveIndex, bool8 usedByAI);")
          s=s.replace("void PokemonSummaryDoMonAnimation(struct Sprite *sprite, enum Species species, bool8 oneFrame);","void PokemonSummaryDoMonAnimation(struct Sprite *sprite, enum Species species, bool8 oneFrame, bool32 isShadow);")
          needle="u8 GetFormIdFromFormSpeciesId(enum Species formSpeciesId);\n"
          add="enum Species GetFormChangeTargetSpecies(struct Pokemon *mon, enum FormChanges method);\nenum Species GetFormChangeTargetSpeciesBoxMon(struct BoxPokemon *boxMon, enum FormChanges method);\n"
          if "GetFormChangeTargetSpecies(struct Pokemon *mon" not in s: s=s.replace(needle,needle+add)
          p.write_text(s)
          p=Path("include/pokemon_summary_screen.h"); s=p.read_text()
          needle="void SummaryScreen_SetAnimDelayTaskId(u8 taskId);\n"
          if "void StopShadowAnimDelayTask(void);" not in s: s=s.replace(needle,needle+"void StopShadowAnimDelayTask(void);\n")
          p.write_text(s)
          PY
            git add include/pokemon.h include/pokemon_summary_screen.h
            git cherry-pick --continue
          fi

          git cherry-pick fc377762f3

          if ! git cherry-pick eec9a9ca63; then
            git checkout eec9a9ca63 -- src/swsh_party_menu.c src/data/swsh_party_menu.h graphics/party_menu/wPartyBalls
            git add -A
            git cherry-pick --continue
          fi

          for c in f08d673000 b2966cd680 b1efcdee09; do
            if ! git cherry-pick "$c"; then
              git checkout "$c" -- src/swsh_party_menu.c src/data/swsh_party_menu.h graphics/party_menu/swsh
              git add -A
              git cherry-pick --continue
            fi
          done

          git rm .github/workflows/port-worpbane-party.yml
          git commit -m "Remove temporary Party UI port workflow"
          git push origin HEAD:worpbane-ui-no-battle-hud
