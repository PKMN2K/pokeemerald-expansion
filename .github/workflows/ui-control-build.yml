name: UI Control ROM Build

on:
  pull_request:
  workflow_dispatch:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-ui-control-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build Emerald
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

      - name: Verify GBA image
        run: |
          test -f pokeemerald.gba
          test "$(stat -c%s pokeemerald.gba)" -eq 33554432
          sha256sum pokeemerald.gba

      - name: Upload control ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-ui-control-rom
          path: pokeemerald.gba
          if-no-files-found: error
