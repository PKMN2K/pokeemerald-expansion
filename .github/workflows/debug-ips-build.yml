name: Debug IPS Build

on:
  pull_request:
    branches:
      - master

jobs:
  build-debug-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build debug ROM
        run: make -j$(nproc) -O all

      - name: Upload debug ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-ui-debug-rom
          path: pokeemerald.gba
          if-no-files-found: error
