name: Polished Crystal CI trigger watchdog

# A scheduled run on the default branch is independent of commit/PR webhook
# suppression from automated GitHub API writes. Dispatch only an untested HEAD.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: polished-crystal-ci-watchdog
  cancel-in-progress: false

jobs:
  dispatch-untested-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch Polished Crystal CI only for an untested branch head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: polished-crystal-port
          TARGET_WORKFLOW: build.yml
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')"
          echo "Polished Crystal HEAD: $current_sha"
          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source branch SHA" >&2
            exit 1
          fi

          # A completed, queued or running workflow for the same commit counts.
          # Re-running failed builds is a deliberate separate action.
          count="$(gh api --method GET "repos/$GH_REPO/actions/workflows/$TARGET_WORKFLOW/runs" \
            -f branch="$TARGET_BRANCH" -f head_sha="$current_sha" -f per_page=1 \
            --jq '.total_count')"
          if [[ ! "$count" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine existing run count" >&2
            exit 1
          fi
          if (( count > 0 )); then
            echo "CI already recorded for $current_sha; skipping."
            exit 0
          fi

          echo "No CI run found for $current_sha; dispatching."
          gh workflow run "$TARGET_WORKFLOW" --ref "$TARGET_BRANCH"
          echo "Dispatched Polished Crystal CI at $current_sha"
