name: CI

on:
  push:
    branches:
      - master
      - upcoming
      - polished-crystal-port
  pull_request:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-emerald:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Emerald)
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

  build-firered:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Firered)
        run: make firered -j$(nproc) -O

  build-leafgreen:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Leafgreen)
        run: make leafgreen -j$(nproc) -O

  release:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Release
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) release

  test:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-check-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Validate Polished Crystal field artwork wiring
        run: python3 tools/polished_port/scripts/check_field_art_wiring.py

      - name: Validate Johto collision mapping audit
        run: python3 tools/polished_port/scripts/test_johto_collision_mapping.py

      - name: Validate Johto primary and secondary metatile banks
        run: python3 tools/polished_port/scripts/test_johto_metatile_banks.py

      - name: Audit Johto outdoor diagnostic grid without map registration
        run: python3 tools/polished_port/scripts/audit_johto_outdoor_test_grid.py

      - name: Audit Johto water and directional ledge field candidates
        run: |
          report="$(mktemp)"
          python3 tools/polished_port/scripts/audit_johto_ledge_water_fields.py --output "$report"
          python3 - "$report" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["original_metatile_count"] == 1012
          assert doc["affected_metatiles"] == len(doc["records"])
          assert set(doc["counts"]) == set(doc["ledge_candidates"]) | set(doc["water_candidates"]) | set(doc["obstacle_symbols"])
          assert not doc["attributes_generated"] and not doc["live_layout_registered"]
          assert not doc["surf_and_jump_verified"]
          PY

      - name: Audit Johto test-cell candidate behaviors and binary encoding
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/audit_johto_test_cell_encoding.py --output "$output"
          python3 - "$output" <<'PY'
          import json, pathlib, sys
          report = json.loads((pathlib.Path(sys.argv[1]) / "johto_test_cell_encoding_audit.json").read_text())
          assert report["cells_checked"] == 64
          assert report["source_cell_binary_round_trip_checked"]
          assert report["basic_map_collision_bits_clear"]
          assert not report["runtime_collision_verified"]
          assert not report["map_registered"]
          PY

      - name: Stage isolated Johto map package without ROM registration
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/stage_johto_isolated_map_package.py --output "$output"
          python3 - "$output" <<'PY'
          import hashlib, json, pathlib, struct, sys
          root = pathlib.Path(sys.argv[1]) / "OFFLINE_ONLY"
          report = json.loads((root / "package_manifest.json").read_text())
          layout = json.loads((root / "layout_entry.review.json").read_text())
          header = json.loads((root / "map_header.INCOMPLETE.review.json").read_text())
          map_file = root / "data/layouts/PolishedJohto_WalkabilityTest/map.bin"
          border_file = root / "data/layouts/PolishedJohto_WalkabilityTest/border.bin"
          assert report["status"] == "offline_package_NOT_FOR_ROM"
          obstacles_dir = root / "obstacle_collision_review"
          obstacles = json.loads((obstacles_dir / "johto_obstacle_collision.review.json").read_text())
          obstacles_raw = (obstacles_dir / "johto_obstacle_collision.review.bin").read_bytes()
          assert obstacles["status"] == "OFFLINE_OBSTACLE_MAPGRID_REVIEW_NOT_FOR_ROM"
          assert len(obstacles_raw) == obstacles["review_map_bytes"] == 128
          assert obstacles["changed_cells"] == report["obstacle_collision_review_cells"] == 6
          assert set(obstacles["source_symbols"]) == {
              "WALL", "VOID", "TOP_WALL", "BOTTOM_WALL", "BUOY", "WHIRLPOOL"
          }
          assert obstacles["collision_value"] == 3 and obstacles["collision_bits_engine_verified"]
          assert obstacles["source_wall_and_obstacle_graphics_verified"]
          assert obstacles["all_untouched_map_cells_preserved"] and obstacles["debug_spawn_untouched"]
          assert all(a["candidate_attribute_word"] is None for a in obstacles["assignments"])
          assert all(a["collision"] == 3 for a in obstacles["assignments"])
          assert hashlib.sha256(obstacles_raw).hexdigest() == report["obstacle_collision_review_sha256"]
          assert obstacles["base_map_sha256"] == hashlib.sha256(map_file.read_bytes()).hexdigest()
          assert not obstacles["registered_with_engine"] and not obstacles["safe_to_register"]
          assert not obstacles["emulator_collision_verified"]
          assert report["obstacle_collision_review_offline_only"]
          layer = json.loads((obstacles_dir / "johto_obstacle_foreground_priority.review.json").read_text())
          assert layer["status"] == "OBSTACLE_FOREGROUND_PRIORITY_SOURCE_REVIEW_ONLY"
          assert layer["obstacle_map_sha256"] == report["obstacle_collision_review_sha256"]
          assert layer["obstacle_metatiles_checked"] == 6
          assert layer["source_8x8_subtiles_checked"] == report["obstacle_foreground_subtiles_checked"] == 24
          assert layer["source_bit7_priority_references_matched"]
          assert layer["base_bg2_geometry_and_flips_matched"]
          assert layer["masked_bg1_graphics_matched"]
          assert layer["candidate_metatile_layer"] == "METATILE_LAYER_TYPE_NORMAL"
          assert layer["total_priority_subtiles"] == sum(
              o["priority_subtile_count"] for o in layer["obstacles"]
          )
          assert all(len(o["subtiles"]) == 4 for o in layer["obstacles"])
          assert report["obstacle_priority_source_flags_verified"]
          assert report["obstacle_bg1_bg2_source_conversion_verified"]
          assert not layer["sprite_elevation_parity_verified_in_emulator"]
          assert not report["obstacle_sprite_occlusion_verified_in_emulator"]
          assert not layer["registered_with_engine"] and not layer["safe_to_enable"]
          probe_root = root / "sprite_occlusion_probes"
          probe = json.loads((probe_root / "johto_sprite_occlusion_probes.review.json").read_text())
          probe_bytes = (probe_root / "johto_sprite_occlusion_probes.OFFLINE.bin").read_bytes()
          assert probe["status"] == "OFFLINE_SPRITE_OCCLUSION_PROBES_NOT_FOR_ROM"
          assert probe["map_bytes"] == len(probe_bytes) == 128
          assert probe["obstacle_case_count"] == report["sprite_occlusion_probe_cases"] == 7
          assert probe["player_probe_count"] == report["sprite_occlusion_probe_positions"] == 14
          assert probe["priority_mask_case_count"] == report["sprite_occlusion_priority_cases"] == 1
          assert hashlib.sha256(probe_bytes).hexdigest() == report["sprite_occlusion_probe_map_sha256"]
          assert probe["base_map_sha256"] == hashlib.sha256(map_file.read_bytes()).hexdigest()
          assert probe["cases"][0]["case_id"] == "ordinary_wall"
          assert probe["cases"][1]["case_id"] == "priority_wall"
          assert probe["cases"][0]["expected_foreground_opaque_pixels"] == 0
          assert probe["cases"][1]["expected_foreground_opaque_pixels"] > 0
          assert len(probe["cases"]) == 7
          assert all(len(case["probes"]) == 2 for case in probe["cases"])
          assert all(len(case["foreground_opaque_mask_rows_hex"]) == 16 for case in probe["cases"])
          assert all(not case["runtime_occlusion_verified"] for case in probe["cases"])
          assert probe["original_source_graphics_used"]
          assert probe["foreground_masks_source_checked"]
          assert not probe["complete_metatile_attribute_tables"]
          assert not probe["sprite_overdraw_and_movement_verified_in_emulator"]
          assert not probe["map_registered"] and not probe["safe_to_enable"]
          assert not report["sprite_occlusion_probe_registered"]
          cov = json.loads((root / "attribute_coverage/johto_full_layer_attribute_coverage.review.json").read_text())
          assert cov["status"] == "SOURCE_LAYER_FIELDS_REVIEW_ONLY_BEHAVIORS_INCOMPLETE"
          assert len(cov["metatiles"]) == cov["source_metatiles_checked"] == 1012
          assert cov["source_8x8_references_checked"] == 4048
          assert cov["primary_source_entries"] == 512 and cov["secondary_source_entries"] == 500
          assert cov["absent_secondary_source_ids"] == list(range(1012, 1024))
          assert cov["normal_layer_candidates"] == report["all_johto_layer_candidates_verified"] == 1012
          assert cov["original_priority_8x8_references_checked"] == report["all_johto_source_priority_tiles_verified"] == 38
          assert cov["source_bg2_palette_flip_bits_checked"] and cov["original_masked_priority_graphics_checked"]
          assert cov["known_behavior_word_candidates"] == report["johto_known_behavior_candidates"] > 0
          assert cov["unresolved_behavior_words"] == report["johto_unresolved_behavior_words"] > 0
          assert cov["known_behavior_word_candidates"] + cov["unresolved_behavior_words"] == 1012
          assert all(row["source_derived_layer_type"] == "METATILE_LAYER_TYPE_NORMAL" for row in cov["metatiles"])
          assert all(row["full_attribute_word"] is None for row in cov["metatiles"]
                     if row["behavior_requires_further_mapping"])
          assert all(cov["metatiles"][probe["metatile_id"]]["candidate_behavior_word"] is None
                     for probe in probe["cases"])
          assert not cov["source_metatile_attribute_table_emitted"]
          assert not cov["complete_primary_behavior_attribute_table"]
          assert not cov["complete_secondary_behavior_attribute_table"]
          assert not cov["ready_for_live_map_registration"]
          assert not report["full_johto_attribute_table_emitted"]
          wallroot = root / "wall_collision_rules"
          wallreport = json.loads((wallroot / "johto_wall_collision_rules.review.json").read_text())
          wallbin = (wallroot / "johto_wall_collision_rules.review.bin").read_bytes()
          wallpairs = list(struct.iter_unpack("<HH", wallbin))
          assert wallreport["status"] == "WALL_MAPGRID_COLLISION_RULES_NOT_FOR_ROM"
          assert len(wallpairs) == wallreport["review_pairs"] == report["source_wall_collision_rule_count"] == 481
          assert len(wallbin) == wallreport["review_binary_bytes"] == 4 * 481
          assert hashlib.sha256(wallbin).hexdigest() == report["wall_collision_rule_binary_sha256"]
          assert wallpairs == [(w["metatile_id"], w["candidate_mapcell_collision_mask"]) for w in wallreport["walls"]]
          assert all(bits == 0x0C00 for _, bits in wallpairs)
          assert wallpairs == sorted(wallpairs) and len(set(mid for mid, _ in wallpairs)) == 481
          assert wallreport["source_wall_primary"] + wallreport["source_wall_secondary"] == 481
          assert wallreport["source_priority_wall_metatiles"] == 3
          assert all(w["candidate_emerald_behavior"] is None for w in wallreport["walls"])
          assert all(w["candidate_full_metatile_attribute_word"] is None for w in wallreport["walls"])
          assert all((w["example_land_cell_elevation_3"] & 0x0C00) == 0x0C00 for w in wallreport["walls"])
          assert all((w["example_surf_cell_elevation_1"] >> 12) == 1 for w in wallreport["walls"])
          assert wallreport["movement_gate_checked_against_native_engine"]
          assert report["wall_collision_rule_engine_gate_checked"]
          assert wallreport["wall_behavior_words_still_unresolved"] == 481
          assert wallreport["wall_attribute_fallbacks_added"] == report["wall_attribute_fallbacks_added"] == 0
          assert not wallreport["complete_tileset_attributes_exported"]
          assert not wallreport["wall_sprite_occlusion_verified_in_emulator"]
          assert not wallreport["safe_for_live_registration"] and not report["wall_collision_rules_registered"]
          waterdir = root / "water_ledge_field_probes"
          water = json.loads((waterdir / "johto_water_ledge_field_probes.review.json").read_text())
          assert water["status"] == "JOHTO_WATER_LEDGE_OFFLINE_ENGINE_REVIEW_NOT_FOR_ROM"
          assert water["source_metatiles_checked"] == report["water_ledge_metatiles_reviewed"] == 78
          assert water["source_water_metatiles"] == 59
          assert water["source_cardinal_ledge_metatiles"] == report["water_ledge_cardinal_count"] == 15
          assert water["source_diagonal_ledge_metatiles"] == report["water_ledge_corner_source_count"] == 4
          assert report["water_ledge_diagonal_blocked_count"] == 0
          assert water["counts"] == {
              "WATER": 59, "LEDGE_DOWN": 7, "LEDGE_LEFT": 4, "LEDGE_RIGHT": 4,
              "LEDGE_DOWN_LEFT": 2, "LEDGE_DOWN_RIGHT": 2,
          }
          assert water["native_engine_audit"]["surfable_water_behavior_and_shore_entry_path_verified"]
          assert water["native_engine_audit"]["surf_exit_elevation_gate_verified"]
          assert water["native_engine_audit"]["cardinal_ledge_jump_dispatch_verified"]
          assert water["native_engine_audit"]["diagonal_jump_engine_support"] is False
          assert water["native_engine_audit"]["corner_ledge_cardinal_compatibility_supported_in_engine"]
          assert water["native_engine_audit"]["crystal_corner_facing_permissions"] == {
              "LEDGE_DOWN_LEFT": ["south", "west"],
              "LEDGE_DOWN_RIGHT": ["east", "south"],
          }
          assert water["corner_ledge_source_facing_masks_verified"]
          assert report["water_ledge_corner_dispatch_source_verified"]
          assert not water["diagonal_ledges_require_new_engine_logic"]
          assert water["corner_ledge_engine_extension_compiled_but_not_playtested"]
          assert water["pond_vs_ocean_water_choice_unresolved"]
          assert len(water["offline_map_variants"]) == report["water_ledge_probe_variants"] == 6
          assert {m["source_symbol"] for m in water["offline_map_variants"]} == {
              "WATER", "LEDGE_DOWN", "LEDGE_LEFT", "LEDGE_RIGHT",
              "LEDGE_DOWN_LEFT", "LEDGE_DOWN_RIGHT"
          }
          corners = [i for i in water["offline_map_variants"] if i["source_symbol"] in (
              "LEDGE_DOWN_LEFT", "LEDGE_DOWN_RIGHT"
          )]
          assert len(corners) == 2
          assert all(len(i["additional_allowed_direction_probes"]) == 1 for i in corners)
          assert {i["source_symbol"]: set(i["source_permitted_jump_directions"]) for i in corners} == {
              "LEDGE_DOWN_LEFT": {"south", "west"},
              "LEDGE_DOWN_RIGHT": {"south", "east"},
          }
          for item in water["offline_map_variants"]:
              raw = (waterdir / item["filename"]).read_bytes()
              words = struct.unpack("<64H", raw)
              target = item["test_target_xy"]
              spawn = item["actor_spawn_xy"]
              assert len(raw) == 128
              assert hashlib.sha256(raw).hexdigest() == item["sha256"]
              assert (words[target[1] * 8 + target[0]] & 0x03FF) == item["source_metatile_id"]
              assert (words[target[1] * 8 + target[0]] >> 12) == item["test_target_elevation_candidate"]
              assert ((words[target[1] * 8 + target[0]] >> 10) & 3) == 0
              assert (words[spawn[1] * 8 + spawn[0]] >> 12) == 3
              assert item["expected_runtime_result_verified"] is False
          assert {item["candidate_emerald_behavior"] for item in water["metatiles"]
                  if item["source_symbol"] in ("LEDGE_DOWN_LEFT", "LEDGE_DOWN_RIGHT")} == {
              "MB_JOHTO_LEDGE_DOWN_LEFT", "MB_JOHTO_LEDGE_DOWN_RIGHT"
          }
          assert all(item["candidate_emerald_behavior_word"] is None for item in water["metatiles"])
          assert all(not item["surf_jump_and_shore_transition_verified"] for item in water["metatiles"])
          assert not water["full_attribute_words_emitted"]
          assert not water["safe_to_enable"] and not water["live_map_registered"]
          assert not report["water_ledge_behavior_attributes_registered"]
          bindings_root = root / "attribute_bindings"
          bindings = json.loads((bindings_root / "johto_test_attribute_bindings.review.json").read_text())
          raw_bindings = (bindings_root / "johto_test_attribute_bindings.review.bin").read_bytes()
          import struct
          pairs = list(struct.iter_unpack("<HH", raw_bindings))
          assert pairs == [(x["metatile_id"], x["candidate_attribute_word"])
                           for x in bindings["bindings"]]
          assert len(pairs) == bindings["binding_count"] == report["test_metatile_binding_count"]
          assert len(raw_bindings) == bindings["binary_bytes"] == 4 * len(pairs)
          assert hashlib.sha256(raw_bindings).hexdigest() == report["test_metatile_bindings_sha256"]
          assert bindings["map_cells_checked"] == 64
          assert bindings["border_cells_checked"] == 4
          assert bindings["no_unresolved_attribute_fallback"]
          assert bindings["original_metatile_ids_preserved"]
          assert report["test_metatile_geometry_verified"]
          assert not report["test_metatile_bindings_live_usable"]
          assert not bindings["live_registration_allowed"]
          assert not bindings["complete_primary_attribute_table"]
          assert not bindings["complete_secondary_attribute_table"]
          assert report["map_bytes"] == map_file.stat().st_size == 128
          assert report["border_bytes"] == border_file.stat().st_size == 8
          assert hashlib.sha256(map_file.read_bytes()).hexdigest() == report["map_sha256"]
          assert hashlib.sha256(border_file.read_bytes()).hexdigest() == report["border_sha256"]
          assert layout["layout_version"] == "emerald"
          assert layout["id"] == header["layout"]
          assert header["region"] == "REGION_JOHTO"
          assert header["music"] == "MUS_DUMMY"
          assert header["weather"] == "WEATHER_NONE"
          assert header["map_type"] == "MAP_TYPE_ROUTE"
          assert header["battle_scene"] == "MAP_BATTLE_SCENE_NORMAL"
          assert header["region_map_section"] == "MAPSEC_NONE"
          section = report["temporary_region_map_placeholder"]
          assert section["section"] == "MAPSEC_NONE"
          assert section["source_entries"] > 0
          assert not section["native_johto_map_section_registered"]
          assert not section["actual_johto_placement_verified"]
          assert report["header_without_null_field_values"]
          assert report["unresolved_header_fields"] == ["region_map_section"]
          assert len(report["verified_header_constants"]) == 5
          spawn = json.loads((root / "debug_spawn.review.json").read_text())
          assert (spawn["x"], spawn["y"], spawn["elevation"]) == (1, 1, 3)
          assert spawn["proposed_debug_teleport_only"]
          assert not spawn["warp_or_map_group_registered"]
          assert not spawn["in_emulator_verified"]
          assert header["warp_events"] == [] and report["no_warp_or_access_route"]
          assert report["unresolved_header_fields"]
          assert not report["map_registered"] and not report["tilesets_registered"]
          assert not report["safe_to_enable"]
          PY

      - name: Validate proposed isolated Johto layout registration schema
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/prepare_johto_layout_registration.py --output "$output"
          python3 - "$output" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          report = json.loads((root / "johto_layout_registration_proposal.json").read_text())
          entry = report["layout_proposal"]
          assert entry["width"] == entry["height"] == 8
          assert entry["id"] == "LAYOUT_POLISHED_JOHTO_WALKABILITY_TEST"
          assert report["all_test_cells_have_basic_candidate_attributes"]
          assert not report["currently_registered"] and not report["existing_layouts_modified"]
          assert not report["complete_tileset_attribute_tables"]
          assert not report["map_header_and_warp_defined"]
          PY

      - name: Validate isolated Johto basic walkability layout
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/export_johto_basic_walkability_layout.py --output "$output"
          python3 - "$output" <<'PY'
          import json, pathlib, struct, sys
          folder = pathlib.Path(sys.argv[1])
          doc = json.loads((folder / "johto_basic_walkability_layout.json").read_text())
          raw = (folder / "johto_basic_walkability_layout.bin").read_bytes()
          cells = struct.unpack("<64H", raw)
          assert len(raw) == 128 and len(doc["cells"]) == 64
          assert list(cells) == [r["packed_cell"] for r in doc["cells"]]
          assert all((v & 0x0C00) == 0 and (v >> 12) == 3 for v in cells)
          assert all(r["source_symbol"] in ("FLOOR", "TALL_GRASS") for r in doc["cells"])
          assert doc["no_unknown_behavior_fallback"]
          assert not doc["live_map_registered"] and not doc["movement_verified_in_emulator"]
          PY

      - name: Validate safe Johto basic-terrain test selection
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/select_johto_basic_test_terrain.py --output "$output"
          python3 - "$output" <<'PY'
          import json, pathlib, struct, sys
          root = pathlib.Path(sys.argv[1])
          report = json.loads((root / "johto_basic_terrain_selection.json").read_text())
          ids = [x[0] for x in struct.iter_unpack("<H", (root / "johto_basic_terrain_ids.bin").read_bytes())]
          assert len(ids) == report["eligible_count"] > 0
          assert ids == [row["metatile_id"] for row in report["eligible"]]
          assert all(row["source_symbol"] in ("FLOOR", "TALL_GRASS") for row in report["eligible"])
          assert len(set(ids)) == len(ids) and all(0 <= x < 1012 for x in ids)
          assert report["unresolved_terrain_excluded"]
          assert not report["actual_test_map_registered"] and not report["field_walkability_verified"]
          PY

      - name: Validate sparse Johto attribute candidate binaries
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/export_johto_sparse_attributes.py --output "$output"
          python3 - "$output" <<'PY'
          import json, pathlib, struct, sys
          root = pathlib.Path(sys.argv[1])
          meta = json.loads((root / "johto_attribute_candidates.json").read_text())
          primary = struct.unpack("<512H", (root / "johto_primary_attribute_candidates.bin").read_bytes())
          secondary = struct.unpack("<500H", (root / "johto_secondary_attribute_candidates.bin").read_bytes())
          bits = (root / "johto_attribute_candidate_validity.bin").read_bytes()
          words = primary + secondary
          assert len(bits) == 127
          assert meta["candidate_entries"] + meta["unresolved_entries"] == 1012
          assert all((word != 0xFFFF) == bool(bits[i // 8] & (1 << (i % 8))) for i, word in enumerate(words))
          assert not meta["live_binary_suitable"] and not meta["tileset_registered"]
          PY

      - name: Package authentic Johto integration fixture with checksums
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/package_johto_integration_fixture.py --output "$output"
          python3 - "$output" <<'PY'
          import hashlib, json, pathlib, struct, sys
          folder = pathlib.Path(sys.argv[1])
          doc = json.loads((folder / "johto_integration_manifest.json").read_text())
          assert len(doc["files"]) == 6
          assert all(len((folder / name).read_bytes()) == size for name, size in doc["files"].items())
          assert all(hashlib.sha256((folder / name).read_bytes()).hexdigest() == digest for name, digest in doc["sha256"].items())
          assert len(struct.unpack("<64H", (folder / "johto_mapgrid_candidate.bin").read_bytes())) == 64
          assert not doc["attribute_tables_included"] and not doc["map_registered"]
          assert not doc["tilesets_registered"]
          PY

      - name: Export integrated Johto 8x8 collision and elevation fixture
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/export_johto_integrated_mapgrid.py --output "$output"
          python3 - "$output" <<'PY'
          import json, pathlib, struct, sys
          folder = pathlib.Path(sys.argv[1])
          doc = json.loads((folder / "johto_mapgrid_candidate.json").read_text())
          data = (folder / "johto_mapgrid_candidate.bin").read_bytes()
          cells = struct.unpack("<64H", data)
          assert len(data) == 128 and doc["width"] == doc["height"] == 8
          assert [row["packed_cell"] for row in doc["cells"]] == list(cells)
          assert all(not row["verified_in_game"] for row in doc["cells"])
          assert not doc["field_behaviors_verified"] and not doc["map_registered"]
          PY

      - name: Review per-metatile Johto mapgrid collision and elevation blockers
        run: |
          report="$(mktemp)"
          python3 tools/polished_port/scripts/review_johto_mapgrid_blockers.py --output "$report"
          python3 - "$report" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          rows = doc["primary"] + doc["secondary"]
          assert len(doc["primary"]) == 512 and len(doc["secondary"]) == 500
          assert [r["metatile_id"] for r in rows] == list(range(1012))
          assert sum(doc["categories"].values()) == 1012
          assert all(r["required_live_tests"] and not r["verified_in_game"] for r in rows)
          assert not doc["generated_mapgrid_cells"] and not doc["generated_attribute_binary"]
          assert not doc["live_map_registered"]
          PY

      - name: Merge Johto water and ledge candidates with fail-closed behavior review
        run: |
          report="$(mktemp)"
          python3 tools/polished_port/scripts/merge_johto_behavior_candidates.py --output "$report"
          python3 - "$report" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          rows = doc["primary"] + doc["secondary"]
          assert len(rows) == 1012
          assert doc["directional_water_candidates"] > 0
          assert doc["unresolved_attribute_words"] > 0
          assert all(not row["registration_ready"] for row in rows)
          assert not doc["live_attribute_binary_generated"] and not doc["map_registered"]
          PY

      - name: Audit Johto Emerald metatile attributes without live export
        run: |
          report="$(mktemp)"
          python3 tools/polished_port/scripts/audit_johto_metatile_attributes.py --output "$report"
          python3 - "$report" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          rows = doc["primary"] + doc["secondary"]
          assert len(doc["primary"]) == 512 and len(doc["secondary"]) == 500
          assert len(rows) == 1012 and doc["unknown_entries"] > 0
          assert doc["unknown_entries"] == sum(x["candidate_attribute_word"] is None for x in rows)
          assert not doc["binary_exported"] and not doc["map_registered"]
          PY

      - name: Audit Johto foreground masks against provisional elevation
        run: |
          report="$(mktemp)"
          python3 tools/polished_port/scripts/audit_johto_foreground_elevation.py --output "$report"
          python3 - "$report" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert len(doc["cells"]) == 64
          assert doc["flagged_source_blocks"] == [20, 145, 146, 210, 211, 214, 215]
          assert not doc["sprite_occlusion_verified_in_game"]
          assert not doc["live_map_registered"]
          PY

      - name: Validate Johto map-grid elevation encoding without registration
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/validate_johto_elevation_encoding.py --output "$output"
          test "$(wc -c < "$output/johto_elevation_candidate.bin")" -eq 128
          python3 - "$output/johto_elevation_candidate.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert len(report["cells"]) == 64
          assert all(row["candidate_only"] for row in report["cells"])
          assert all((row["encoded_cell"] & 1023) == row["metatile_id"] for row in report["cells"])
          assert not report["registered"] and not report["surf_eligibility_verified"]
          assert not report["object_bg_priority_verified"] and not report["ledge_traversal_verified"]
          PY

      - name: Validate offline Johto map-grid collision preview
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/preview_johto_mapgrid_collision.py --output "$output"
          test "$(wc -c < "$output/johto_collision_preview.bin")" -eq 128
          python3 - "$output/johto_collision_preview.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert len(doc["cells"]) == 64
          assert all(cell["packed_cell"] & 1023 == cell["metatile_id"] for cell in doc["cells"])
          assert not doc["water_surfing_verified"] and not doc["map_registered"]
          assert not doc["metatile_attribute_tables_emitted"]
          PY

      - name: Audit Johto wall and water collision semantics
        run: |
          report="$(mktemp)"
          python3 tools/polished_port/scripts/audit_johto_wall_water_behaviors.py --output "$report"
          python3 - "$report" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["reviewed_metatiles"] + doc["unreviewed_metatiles"] == 1012
          assert set(doc["symbol_counts"]) == set(doc["source_symbols"])
          assert not doc["candidate_is_verified_equivalent"]
          assert not doc["produced_metatile_attributes"] and not doc["registered"]
          PY

      - name: Review Johto collision behavior candidates without live registration
        run: |
          report="$(mktemp)"
          python3 tools/polished_port/scripts/review_johto_emerald_behaviors.py --output "$report"
          python3 - "$report" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["candidate_metatile_count"] + doc["unresolved_metatile_count"] == 1012
          assert doc["unresolved_metatile_count"] > 0
          assert doc["candidate_map"] == {"FLOOR": "MB_NORMAL", "TALL_GRASS": "MB_TALL_GRASS"}
          assert not doc["produced_metatile_attributes"] and not doc["registered"]
          PY

      - name: Verify authentic Johto quadrant collision projection
        run: |
          report="$(mktemp)"
          python3 tools/polished_port/scripts/project_johto_collision_symbols.py --output "$report"
          python3 - "$report" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          rows = doc["primary"] + doc["secondary"]
          assert len(doc["primary"]) == 512 and len(doc["secondary"]) == 500
          assert [row["metatile_id"] for row in rows] == list(range(1012))
          assert all(row["emerald_behavior_id"] is None for row in rows)
          assert doc["unmapped_source_symbols"]
          assert not doc["emerald_attribute_tables_emitted"]
          PY

      - name: Preflight isolated Johto tileset registration blockers
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/preflight_johto_tileset_registration.py --output "$output"
          python3 - "$output/registration_preflight.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report["status"] == "registration_blocked_pending_source_parity"
          assert report["blockers"]
          assert not report["first_test_map_registered"]
          assert report["existing_map_replacements"] == 0
          PY

      - name: Export authentic Johto unregistered tileset bundle
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/export_johto_tileset_bundle.py --output "$output"
          python3 - "$output/tileset_bundle.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["tilesets_registered"] is False and doc["map_registered"] is False
          assert doc["files"]["johto_primary.4bpp"] == 16384
          assert doc["files"]["johto_primary_metatiles.bin"] == 8192
          assert doc["files"]["johto_secondary_metatiles.bin"] == 8000
          PY

      - name: Export isolated Johto layout fixture without map registration
        run: |
          output="$(mktemp -d)"
          python3 tools/polished_port/scripts/export_johto_diagnostic_layout.py --output "$output"
          test "$(wc -c < "$output/map.bin")" -eq 128
          python3 - "$output/layout.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["map_header"] is None and doc["tileset_registration"] is None
          assert doc["width"] == doc["height"] == 8
          PY

      - name: Audit authentic Johto graphics palettes and priority flags
        run: python3 tools/polished_port/scripts/test_johto_graphics_mapping.py

      - name: Verify pinned Polished Crystal Johto RGB555 time palettes
        run: python3 tools/polished_port/scripts/test_johto_time_palettes.py

      - name: Verify authentic Polished Crystal roof palette overrides
        run: python3 tools/polished_port/scripts/test_johto_roof_palettes.py

      - name: Validate original Johto map palette routing against Emerald clock
        run: python3 tools/polished_port/scripts/test_johto_map_palette_routing.py

      - name: Verify source-generated Johto RGB555 tables
        run: python3 tools/polished_port/scripts/emit_johto_palette_c_tables.py --check

      - name: Test guarded Johto Emerald runtime palette composition
        run: python3 tools/polished_port/scripts/test_johto_runtime_palette_tables.py

      - name: Test pinned Johto PNG pixel and VRAM graphics conversion
        run: python3 tools/polished_port/scripts/test_johto_tile_graphics.py

      - name: Verify authentic GBC tile priority overlays and sprite color-zero punch-through
        run: python3 tools/polished_port/scripts/test_johto_priority_overlays.py

      - name: Verify pinned Johto outdoor animation dispatch schedule
        run: python3 tools/polished_port/scripts/test_johto_animation_schedule.py

      - name: Validate authentic Johto animation frame sprites and 22-step timing
        run: python3 tools/polished_port/scripts/test_johto_animation_frames.py
      - name: Test Johto 4bpp scroll dispatcher
        run: python3 tools/polished_port/scripts/test_johto_animation_dispatch_4bpp.py

      - name: Test native Johto C animation state on host
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -DPOLISHED_JOHTO_HOST_TEST -fsanitize=address,undefined -fno-omit-frame-pointer -Itools/polished_port/tests/include -Iinclude src/polished_johto_animation.c tools/polished_port/tests/test_johto_animation_native.c -o /tmp/test_johto_animation_native
          /tmp/test_johto_animation_native

      - name: Test
        env:
          GAME_VERSION: EMERALD
          TEST: 1
        run: make -j$(nproc) check

  # Gate job: satisfies the "build" branch protection rule.
  # Passes only when all parallel build/test jobs succeed.
  build:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: [build-emerald, build-firered, build-leafgreen, release, test]
    steps:
      - name: All builds passed
        run: echo "All builds and tests passed."

  docs_validate:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that SUMMARY.md includes markdown doc files
        run: .github/docs_validate/inclusive_summary.py

  allcontributors:
    if: github.actor == 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Automatically pass for allcontributors
        run: echo "CI automatically passes for allcontributors" && exit 0
