name: CI

on:
  push:
    branches:
      - master
      - upcoming
      - feature/gen4-ui-renderer
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-emerald:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          echo "::group::APT update"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          echo "::endgroup::"
          echo "::group::Install ARM toolchain and image dependencies"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
          echo "::endgroup::"
          arm-none-eabi-as --version | head -n 1
          arm-none-eabi-gcc --version | head -n 1

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Emerald)
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

  gen4-ui:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          echo "::group::APT update"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          echo "::endgroup::"
          echo "::group::Install ARM toolchain and image dependencies"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
          echo "::endgroup::"
          arm-none-eabi-as --version | head -n 1
          arm-none-eabi-gcc --version | head -n 1

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Validate Gen 4 UI tools
        run: |
          python3 -m py_compile tools/gen4_ui/pack_gen4_ui.py tools/gen4_ui/make_test_fixture.py tools/gen4_ui/make_hgss_pokedex_member_020.py tools/gen4_ui/make_hgss_pokedex_list_member_000.py tools/gen4_ui/make_hgss_pokedex_list_overlay.py tools/gen4_ui/make_hgss_pokedex_stats.py tools/gen4_ui/make_hgss_pokedex_evolution.py tools/gen4_ui/make_hgss_pokedex_forms.py tools/gen4_ui/make_hgss_pokedex_cry.py tools/gen4_ui/make_hgss_pokedex_size.py tools/gen4_ui/make_hgss_pokedex_search.py tools/gen4_ui/make_hgss_pokedex_search_overlay.py tools/gen4_ui/make_hgss_pokedex_area_chrome.py tools/gen4_ui/make_hgss_pokedex_start_menu.py tools/gen4_ui/make_hgss_pokedex_scroll_controls.py tools/gen4_ui/make_hgss_pokegear_app_switch.py tools/gen4_ui/make_hgss_pokegear_cursor.py tools/gen4_ui/make_hgss_pokegear_phone_status.py tools/gen4_ui/make_hgss_pokegear_condition_search.py tools/gen4_ui/make_hgss_pokegear_list_arrows.py tools/gen4_ui/make_hgss_pokegear_rematch_badge.py \
            tools/gen4_ui/make_hgss_pokegear_match_call_contact.py \
            tools/gen4_ui/make_hgss_pokegear_match_call_call.py \
            tools/gen4_ui/make_hgss_pokegear_contact_rows.py \
            tools/gen4_ui/make_hgss_pokegear_action_menu.py \
            tools/gen4_ui/make_hgss_trainer_card_check_portrait.py \
            tools/gen4_ui/make_hgss_pokegear_help_bar.py \
            tools/gen4_ui/make_hgss_pokegear_map_sub0.py \
            tools/gen4_ui/make_hgss_pokegear_map_main1.py \
            tools/gen4_ui/make_hgss_pokegear_map_sub2.py \
            tools/gen4_ui/make_hgss_pokegear_map_cursor.py \
            tools/gen4_ui/make_hgss_pokegear_map_player_marker.py \
            tools/gen4_ui/make_hgss_pokegear_map_flypoint.py \
            tools/gen4_ui/audit_hgss_pokegear_top_header.py \
            tools/gen4_ui/audit_hgss_pokegear_bg_dots.py \
            tools/gen4_ui/audit_hgss_pokegear_nav_icon.py \
            tools/gen4_ui/audit_hgss_pokegear_left_headers.py \
            tools/gen4_ui/audit_hgss_pokegear_message_box.py \
            tools/gen4_ui/audit_hgss_pokegear_map_city_zoom_text.py \
            tools/gen4_ui/audit_hgss_pokegear_map_city_zoom_obj_palette.py \
            tools/gen4_ui/audit_hgss_pokegear_map_player_marker.py \
            tools/gen4_ui/audit_hgss_pokegear_map_fly_frame.py
          python3 tools/gen4_ui/audit_hgss_pokegear_top_header.py
          python3 tools/gen4_ui/audit_hgss_pokegear_bg_dots.py
          python3 tools/gen4_ui/audit_hgss_pokegear_nav_icon.py
          python3 tools/gen4_ui/audit_hgss_pokegear_left_headers.py
          python3 tools/gen4_ui/audit_hgss_pokegear_message_box.py
          python3 tools/gen4_ui/audit_hgss_pokegear_map_city_zoom_text.py
          python3 tools/gen4_ui/audit_hgss_pokegear_map_city_zoom_obj_palette.py
          python3 tools/gen4_ui/audit_hgss_pokegear_map_player_marker.py
          python3 tools/gen4_ui/audit_hgss_pokegear_map_fly_frame.py

      - name: Test HGSS ribbon palette remapping
        run: python3 -m unittest discover -s tests -p 'test_hgss_ribbon_palette_remap.py' -v

      - name: Validate imported HGSS ribbon assets
        run: python3 tools/validate_hgss_ribbon_assets.py

      - name: Check HGSS ribbon grid geometry and generate offline previews
        run: python3 tools/gen4_ui/check_hgss_ribbon_grid.py --preview-dir build/hgss-ribbon-grid-preview

      - name: Upload HGSS ribbon grid offline previews
        uses: actions/upload-artifact@v4
        with:
          name: hgss-ribbon-grid-offline-previews
          path: build/hgss-ribbon-grid-preview/
          if-no-files-found: error

      - name: Build Gen 4 UI assets
